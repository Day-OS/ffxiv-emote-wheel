name: Build Emote Wheel

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish, for example v0.1.0. Leave blank to just build.'
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: |
        $buildArgs = @('build', 'EmoteWheel.slnx', '--configuration', 'Release')
        if ($env:RELEASE_TAG) {
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            throw 'Release tags must use v followed by a version such as v0.1.0.'
          }
          $buildArgs += "-p:Version=$($env:RELEASE_TAG.Substring(1))"
        }
        dotnet @buildArgs

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EmoteWheel
        path: |
          EmoteWheel/bin/x64/Release/EmoteWheel/latest.zip
          EmoteWheel/bin/x64/Release/EmoteWheel/EmoteWheel.json
        if-no-files-found: error
        retention-days: 14

  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: emote-wheel-release
      cancel-in-progress: false

    steps:
    - name: Checkout the repository index
      uses: actions/checkout@v5
      with:
        ref: master

    - name: Download the plugin package
      uses: actions/download-artifact@v4
      with:
        name: EmoteWheel
        path: ${{ runner.temp }}/EmoteWheel

    - name: Generate the repository index
      run: |
        & .github/scripts/New-PluginRepository.ps1 `
          -ManifestPath "$env:RUNNER_TEMP/EmoteWheel/EmoteWheel.json" `
          -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

    - name: Publish the plugin package
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $zip = "$env:RUNNER_TEMP/EmoteWheel/latest.zip"
        if (!(Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Missing plugin ZIP.' }
        $release = gh release view $env:RELEASE_TAG --json isDraft,assets
        if ($LASTEXITCODE -ne 0) {
          gh release create $env:RELEASE_TAG $zip --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
        } else {
          $release = $release | ConvertFrom-Json
          if ($release.isDraft) { throw 'The existing release is a draft.' }
          if ('latest.zip' -notin $release.assets.name) {
            gh release upload $env:RELEASE_TAG $zip
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the plugin ZIP.' }
          }
        }

    - name: Update repo.json on master
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- repo.json
        git commit -m "Update repo.json for $env:RELEASE_TAG"
        if ($LASTEXITCODE -ne 0) { throw 'Could not commit repo.json.' }
        git push origin HEAD:master

